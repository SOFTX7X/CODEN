<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <title>CODEN Video</title>
  <link rel="stylesheet" href="assets/style.css?v=7" />
</head>
<body>
  <main id="app">
    <section id="feed" class="feed" aria-label="Feed de vídeos"></section>
  </main>

  <div id="sheetBackdrop" class="backdrop hidden"></div>

  <aside id="actionsSheet" class="mini-sheet hidden" aria-label="Ações do vídeo">
    <button id="actionLike" title="Curtir">♡</button>
    <button id="actionComment" title="Comentar">COMENTAR</button>
    <button id="actionSave" title="Salvar">SALVAR</button>
    <button id="actionShare" title="Compartilhar">ENVIAR</button>
    <button id="actionFullscreen" title="Tela cheia">TELA CHEIA</button>
    <button id="actionReport" class="danger-text">DENUNCIAR</button>
  </aside>

  <aside id="commentsSheet" class="sheet hidden" aria-label="Comentários">
    <div class="sheet-head"><strong>COMENTÁRIOS</strong><button data-close="commentsSheet" class="icon-btn">×</button></div>
    <div id="commentsList" class="comments-list"></div>
    <form id="commentForm" class="comment-form"><input id="commentInput" maxlength="280" placeholder="Escreva um comentário..." /><button>ENVIAR</button></form>
  </aside>

  <aside id="publishSheet" class="sheet hidden" aria-label="Publicar vídeo">
    <div class="sheet-head"><strong>PUBLICAR</strong><button data-close="publishSheet" class="icon-btn">×</button></div>
    <form id="publishForm" class="publish-form">
      <label class="upload-box"><input id="videoFile" type="file" accept="video/*" hidden /><span>ESCOLHER VÍDEO DA GALERIA</span><small id="pickedFile">Nenhum vídeo selecionado</small></label>
      <div class="or">OU</div>
      <input id="externalUrl" type="url" placeholder="Link de vídeo (opcional)" />
      <input id="videoTitle" maxlength="120" placeholder="Título curto (opcional)" />
      <button id="publishSubmit" class="primary" type="submit">PUBLICAR</button>
      <p id="publishStatus" class="muted small"></p>
    </form>
  </aside>

  <aside id="profileSetupSheet" class="sheet hidden" aria-label="Criar perfil">
    <div class="sheet-head"><strong>SEU PERFIL</strong><button data-close="profileSetupSheet" class="icon-btn">×</button></div>
    <form id="profileSetupForm" class="publish-form">
      <p class="muted small">Escolha apenas seu @ para começar. Não há tela de login.</p>
      <input id="setupUsername" maxlength="24" placeholder="@usuario" required />
      <input id="setupDisplayName" maxlength="60" placeholder="Nome (opcional)" />
      <button class="primary" type="submit">CONTINUAR</button>
      <p id="profileSetupStatus" class="muted small"></p>
    </form>
  </aside>

  <section id="profileView" class="overlay-view hidden">
    <div class="profile-top"><button class="back-btn" data-close-view>‹</button><strong id="profileTopTitle">PERFIL</strong><button id="profilePublish" class="small-plus">+</button></div>
    <div class="profile-card">
      <div id="profileAvatar" class="avatar">C</div>
      <div class="profile-meta"><h1 id="profileHandle">@perfil</h1><p id="profileDisplay">Perfil de vídeos</p><div class="profile-stats"><span><b id="profileLikes">0</b> likes</span><span><b id="profileVideos">0</b> vídeos</span></div></div>
      <button id="likeProfileBtn" class="outline">♡ CURTIR PERFIL</button><button id="editProfileBtn" class="outline profile-edit-btn">EDITAR PERFIL</button>
    </div>
    <div id="profileGrid" class="profile-grid"></div>
  </section>


  <nav id="bottomNav" class="bottom-nav" aria-label="Navegação principal">
    <button data-nav="home"><span>⌂</span><small>INÍCIO</small></button>
    <button data-nav="search"><span>⌕</span><small>PESQUISAR</small></button>
    <button data-nav="publish" class="nav-plus"><span>＋</span></button>
    <button data-nav="profile"><span id="navAvatar">●</span><small>PERFIL</small></button>
  </nav>

  <aside id="searchSheet" class="sheet hidden" aria-label="Pesquisar">
    <div class="sheet-head"><strong>PESQUISAR</strong><button data-close="searchSheet" class="icon-btn">×</button></div>
    <div class="search-wrap"><input id="searchInput" placeholder="Pesquisar vídeos ou @perfil" /><div id="searchResults" class="search-results"></div></div>
  </aside>

  <aside id="profileEditSheet" class="sheet hidden" aria-label="Editar perfil">
    <div class="sheet-head"><strong>EDITAR PERFIL</strong><button data-close="profileEditSheet" class="icon-btn">×</button></div>
    <form id="profileEditForm" class="publish-form">
      <label class="upload-box"><input id="avatarFile" type="file" accept="image/*" hidden /><span>ESCOLHER FOTO DE PERFIL</span><small id="pickedAvatar">Nenhuma foto selecionada</small></label>
      <input id="editUsername" maxlength="24" placeholder="@usuario" required />
      <input id="editDisplayName" maxlength="60" placeholder="Nome (opcional)" />
      <button class="primary" type="submit">SALVAR PERFIL</button>
      <p id="profileEditStatus" class="muted small"></p>
    </form>
  </aside>

  <div id="fullscreenControls" class="fullscreen-controls hidden">
    <button id="fsPlayPause">PAUSAR</button>
    <button id="fsExit">VOLTAR À TELA NORMAL</button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/config.js"></script>
  <script src="assets/app.js?v=7"></script>
</body>
</html>
