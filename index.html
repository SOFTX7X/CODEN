<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <title>CODEN Video</title>
  <link rel="stylesheet" href="assets/style.css?v=15" />
</head>
<body>
  <main id="app">
    <section id="feed" class="feed" aria-label="Feed de vídeos"></section>
  </main>

  <div id="sheetBackdrop" class="backdrop hidden"></div>

  <aside id="actionsSheet" class="mini-sheet hidden" aria-label="Ações do vídeo">
    <button id="actionLike" title="Curtir">♡</button>
    <button id="actionComment" title="Comentar">COMENTAR</button>
    <button id="actionSave" title="Salvar">SALVAR</button>
    <button id="actionShare" title="Compartilhar">ENVIAR</button>
    <button id="actionFullscreen" title="Tela cheia">TELA CHEIA</button>
    <button id="actionReport" class="danger-text">DENUNCIAR</button>
  </aside>

  <aside id="commentsSheet" class="sheet hidden" aria-label="Comentários">
    <div class="sheet-head"><strong>COMENTÁRIOS</strong><button data-close="commentsSheet" class="icon-btn">×</button></div>
    <div id="commentsList" class="comments-list"></div>
    <form id="commentForm" class="comment-form"><input id="commentInput" maxlength="280" placeholder="Escreva um comentário..." /><button>ENVIAR</button></form>
  </aside>

  <aside id="publishSheet" class="sheet publish-flow hidden" aria-label="Publicar vídeo">
    <form id="publishForm" class="publish-form publish-instagram">
      <section id="publishStepSelect" class="publish-step">
        <header class="publish-topbar">
          <button type="button" data-close="publishSheet" class="publish-back" aria-label="Fechar">×</button>
          <strong>NOVO VÍDEO</strong>
          <button id="publishNext" type="button" class="publish-next" disabled>AVANÇAR</button>
        </header>

        <div id="publishPreviewWrap" class="publish-select-preview">
          <video id="publishPreview" playsinline muted loop preload="metadata"></video>
          <div id="publishEmpty" class="publish-empty">
            <span class="publish-empty-icon" aria-hidden="true">▶</span>
            <strong>SELECIONE UM VÍDEO</strong>
            <small>Escolha um vídeo da Galeria para visualizar antes de publicar.</small>
          </div>
          <label id="publishChange" class="publish-change hidden">
            <input id="videoFile" type="file" accept="video/*" hidden />
            TROCAR VÍDEO
          </label>
        </div>

        <label id="publishChoose" class="publish-gallery-button">
          <input id="videoFileFirst" type="file" accept="video/*" hidden />
          <span>ESCOLHER VÍDEO DA GALERIA</span>
          <small id="pickedFile">Nenhum vídeo selecionado</small>
        </label>

        <details class="publish-link-details">
          <summary>USAR LINK DE VÍDEO</summary>
          <input id="externalUrl" type="url" placeholder="https://..." />
        </details>
      </section>

      <section id="publishStepCaption" class="publish-step hidden">
        <header class="publish-topbar">
          <button id="publishBack" type="button" class="publish-back" aria-label="Voltar">‹</button>
          <strong>NOVA PUBLICAÇÃO</strong>
          <span class="publish-top-spacer"></span>
        </header>

        <div class="publish-final-preview">
          <video id="publishFinalPreview" playsinline muted loop controls preload="metadata"></video>
        </div>

        <label class="publish-caption-wrap">
          <textarea id="videoTitle" maxlength="500" placeholder="Escreva uma legenda..."></textarea>
          <span id="captionCount">0/500</span>
        </label>

        <div class="publish-final-actions">
          <button id="publishSubmit" class="primary" type="submit">PUBLICAR</button>
          <p id="publishStatus" class="muted small"></p>
        </div>
      </section>
    </form>
  </aside>

  <aside id="profileSetupSheet" class="sheet hidden" aria-label="Criar perfil">
    <div class="sheet-head"><strong>SEU PERFIL</strong><button data-close="profileSetupSheet" class="icon-btn">×</button></div>
    <form id="profileSetupForm" class="publish-form">
      <p class="muted small">Escolha apenas seu @ para começar. Não há tela de login.</p>
      <input id="setupUsername" maxlength="24" placeholder="@usuario" required />
      <input id="setupDisplayName" maxlength="60" placeholder="Nome (opcional)" />
      <button class="primary" type="submit">CONTINUAR</button>
      <p id="profileSetupStatus" class="muted small"></p>
    </form>
  </aside>

  <section id="profileView" class="overlay-view hidden">
    <div class="profile-top"><button class="back-btn" data-close-view>‹</button><strong id="profileTopTitle">PERFIL</strong><span></span></div>
    <div class="profile-card">
      <div id="profileAvatar" class="avatar">C</div>
      <div class="profile-meta"><h1 id="profileHandle">@perfil</h1><p id="profileDisplay">Perfil de vídeos</p><div class="profile-stats"><span><b id="profileLikes">0</b> likes</span><span><b id="profileVideos">0</b> vídeos</span></div></div>
      <button id="likeProfileBtn" class="outline">♡ CURTIR PERFIL</button><button id="editProfileBtn" class="outline profile-edit-btn">EDITAR PERFIL</button>
    </div>
    <div id="profileGrid" class="profile-grid"></div>
  </section>


  <nav id="bottomNav" class="bottom-nav" aria-label="Navegação principal">
    <button data-nav="home" aria-label="Início"><span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M3 10.8 12 3l9 7.8v9.7a.5.5 0 0 1-.5.5H15v-6H9v6H3.5a.5.5 0 0 1-.5-.5z"/></svg></span><small>INÍCIO</small></button>
    <button data-nav="search" aria-label="Pesquisar"><span class="nav-icon"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m16.5 16.5 4 4"/></svg></span><small>PESQUISAR</small></button>
    <button data-nav="publish" class="nav-plus" aria-label="Publicar"><span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></span></button>
    <button data-nav="profile" aria-label="Perfil"><span id="navAvatar" class="nav-avatar">P</span><small>PERFIL</small></button>
  </nav>

  <aside id="searchSheet" class="sheet hidden" aria-label="Pesquisar">
    <div class="sheet-head"><strong>PESQUISAR</strong><button data-close="searchSheet" class="icon-btn">×</button></div>
    <div class="search-wrap"><input id="searchInput" placeholder="Pesquisar vídeos ou @perfil" /><div id="searchResults" class="search-results"></div></div>
  </aside>

  <aside id="profileEditSheet" class="sheet hidden" aria-label="Editar perfil">
    <div class="sheet-head"><strong>EDITAR PERFIL</strong><button data-close="profileEditSheet" class="icon-btn">×</button></div>
    <form id="profileEditForm" class="publish-form">
      <div class="avatar-edit-preview"><div id="avatarPreview" class="avatar avatar-preview">P</div></div>
      <label class="upload-box compact-upload"><input id="avatarFile" type="file" accept="image/*" hidden /><span>ESCOLHER FOTO DE PERFIL</span><small id="pickedAvatar">Nenhuma foto selecionada</small></label>
      <input id="editUsername" maxlength="24" placeholder="@usuario" required />
      <input id="editDisplayName" maxlength="60" placeholder="Nome (opcional)" />
      <button class="primary" type="submit">SALVAR PERFIL</button>
      <p id="profileEditStatus" class="muted small"></p>
    </form>
  </aside>


  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/config.js"></script>
  <script src="assets/app.js?v=15"></script>
</body>
</html>
